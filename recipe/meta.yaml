{% set name = "ifes-apt-tc-data-modeling" %}
{% set version = "0.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/ifes_apt_tc_data_modeling-{{ version }}.tar.gz
  sha256: d83a85e23fe54d419843a9569bb029d730dd2288831e0b74c42dcab9d37e2de0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.8
    - setuptools
    - pip
  run:
    - python >=3.8
    - h5py >=3.6.0
    - numpy >=1.21.2
    - ase >=3.19.0
    - radioactivedecay >=0.4.16
    - pandas
    - pytables
    - flatdict
    - xmltodict
    - jupyter
    - jupyterlab
    - jupyterlab-h5web

test:
  imports:
    - ifes_apt_tc_data_modeling
  commands:
    - pip check
  requires:
    - pip

about:
  summary: Exchange about data models and specifications of file formats in atom probe research.
  license: Apache-2.0
  license_file: LICENSE.txt
  home: https://github.com/atomprobe-tc/ifes_apt_tc_data_modeling
  doc_url: https://github.com/atomprobe-tc/ifes_apt_tc_data_modeling
  dev_url: https://github.com/atomprobe-tc/ifes_apt_tc_data_modeling

extra:
  recipe-maintainers:
    - srmnitc
    - mkuehbach
